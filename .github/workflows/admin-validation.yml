name: Admin validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/shared-backend-foundation, goodies/production-readiness]

defaults:
  run:
    working-directory: tiss-admin

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tiss-admin
      - name: Checkout paired customer source for CMS parity tests
        uses: actions/checkout@v4
        with:
          repository: momojdy/tiss_tiss_beta
          ref: 7fba2bba8ef91dfef557935f5d410355deabcf60
          path: tiss_tiss_beta
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiss-admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Bundle Android application
        run: npx expo export --platform android --output-dir dist/android
      - name: Bundle iOS application
        run: npx expo export --platform ios --output-dir dist/ios
      - name: Upload admin verification bundles
        uses: actions/upload-artifact@v4
        with:
          name: goodies-admin-native-js-${{ github.sha }}
          path: tiss-admin/dist
          if-no-files-found: error
