name: Admin validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/shared-backend-foundation]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Bundle Android application
        run: npx expo export --platform android --output-dir dist/android
      - name: Bundle iOS application
        run: npx expo export --platform ios --output-dir dist/ios
