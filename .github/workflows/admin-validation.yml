name: Admin validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, audit/shared-backend-foundation]

defaults:
  run:
    working-directory: tiss-admin

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tiss-admin
      - name: Checkout paired Goodies consumer source
        uses: actions/checkout@v4
        with:
          repository: momojdy/tiss_tiss_beta
          ref: dcc55c2228bf607c0880924bf3f1b84a1955eecc
          path: tiss_tiss_beta
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tiss-admin/package-lock.json
      - run: npm ci
      - name: Goodies permissions, CMS and settlement tests
        run: npm run test:goodies
      - run: npm run typecheck
      - name: Bundle Android application
        run: npx expo export --platform android --output-dir dist/android
      - name: Bundle iOS application
        run: npx expo export --platform ios --output-dir dist/ios
